<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BOLT Browser — Offline Test Page</title>
  <style>
    :root { color-scheme: dark; font-family: "Segoe UI", sans-serif; background: #111318; color: #f5f5f5; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 32px; }
    main { width: min(620px, 100%); padding: 38px; background: #1b1e25; border: 1px solid #30343d; border-radius: 22px; }
    .bolt { color: #f5c542; font-size: 44px; }
    h1 { margin: 10px 0; font-size: clamp(28px, 5vw, 42px); }
    p { color: #b5bac4; line-height: 1.65; }
    code { color: #f5c542; }
    a { color: #f5c542; }
    button { margin-top: 12px; padding: 11px 16px; border: 0; border-radius: 9px; background: #f5c542; color: #171717; font-weight: 700; cursor: pointer; }
  </style>
</head>
<body>
  <main>
    <div class="bolt" aria-hidden="true">⚡</div>
    <h1>BOLT Browser is running</h1>
    <p>This page is bundled with the application and works offline. Use the address bar to test HTTPS navigation, search, and browser controls.</p>
    <p>Expected title: <code>BOLT Browser — Offline Test Page</code></p>
    <button type="button" onclick="document.querySelector('#result').textContent = 'Page JavaScript is working.'">Test page interaction</button>
    <p id="result" aria-live="polite"></p>
    <p><a href="https://example.com/">Open example.com</a></p>
  </main>
</body>
</html>
