name: Quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate standalone browser structure
        run: bash tests/check-browser.sh
      - name: Check shell syntax
        run: bash -n tests/check-browser.sh
