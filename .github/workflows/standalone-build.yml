name: Standalone browser build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    name: Windows 11 x64
    runs-on: windows-2022
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Qt WebEngine
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.11.3'
          arch: 'win64_msvc2022_64'
          modules: 'qtwebengine'
          cache: true

      - name: Configure
        shell: pwsh
        run: >-
          cmake -S browser -B build/browser
          -G "Visual Studio 17 2022" -A x64
          -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR"
          -DBUILD_TESTING=ON

      - name: Build
        run: cmake --build build/browser --config Release --parallel 2

      - name: Run tests
        run: ctest --test-dir build/browser -C Release --output-on-failure

      - name: Stage Windows deployment
        shell: pwsh
        run: cmake --install build/browser --config Release --prefix "$env:GITHUB_WORKSPACE\build\package"

      - name: Check WebEngine deployment files
        shell: pwsh
        run: |
          $root = Join-Path $env:GITHUB_WORKSPACE 'build\package'
          $files = Get-ChildItem -LiteralPath $root -Recurse -File
          $required = @('BoltBrowser.exe', 'QtWebEngineProcess.exe', 'qtwebengine_resources.pak')
          foreach ($name in $required) {
            if (-not ($files | Where-Object Name -EQ $name)) {
              throw "Deployment is missing $name"
            }
          }
          if (-not ($files | Where-Object { $_.FullName -match '[\\/]platforms[\\/]qwindows\.dll$' })) {
            throw 'Deployment is missing the Qt Windows platform plugin.'
          }

  linux:
    name: Linux x64
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Qt WebEngine
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.11.3'
          arch: 'linux_gcc_64'
          modules: 'qtwebengine'
          cache: true

      - name: Configure
        run: cmake -S browser -B build/browser -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR" -DBUILD_TESTING=ON

      - name: Build
        run: cmake --build build/browser --parallel 2

      - name: Run tests
        run: ctest --test-dir build/browser --output-on-failure

      - name: Stage Linux deployment
        run: cmake --install build/browser --prefix "$GITHUB_WORKSPACE/build/package"

      - name: Check WebEngine deployment files
        shell: bash
        run: |
          root="$GITHUB_WORKSPACE/build/package"
          find "$root" -type f -name 'BoltBrowser' -print -quit | grep -q .
          find "$root" -type f -name 'QtWebEngineProcess' -print -quit | grep -q .
          find "$root" -type f -name 'qtwebengine_resources.pak' -print -quit | grep -q .
          find "$root" -type f -path '*/platforms/libqxcb.so' -print -quit | grep -q .
